  <text x="1178" y="797" font-family="Menlo" font-weight="bold" font-size="34" fill="#ffffff">“86 salmon”</text>
  <text x="1494" y="796" text-anchor="end" font-family="Menlo" font-size="17" letter-spacing="2" fill="#bfe9d8">COOK</text>

