  <text x="1520" y="578" text-anchor="middle" font-family="Menlo" font-weight="bold" font-size="21" fill="#ffffff">Bump</text>

  <!-- footer -->
  <text x="1182" y="646" font-family="Menlo" font-size="18" letter-spacing="1.4" fill="#8e958d">ORDERED 18:42 · SEAT 4</text>
  <text x="1768" y="646" text-anchor="end" font-family="Menlo" font-size="18" letter-spacing="1.4" fill="#3fbe90">UPDATED IN 0.9s</text>

  <!-- age bar -->
  <rect x="1174" y="672" width="602" height="8" rx="4" fill="#2e322d"/>
  <rect x="1174" y="672" width="372" height="8" rx="4" fill="#ff8a00"/>

  <!-- utterance pill -->
  <rect x="1060" y="730" width="460" height="110" rx="55" fill="#0f7a57"/>
  <g transform="translate(1128 790) scale(0.72)">
    <g fill="#ffffff">
