<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="glowGreen" cx="0.22" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#0f7a57" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#0f7a57" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0f7a57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#ff8a00" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#ff8a00" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5f00"/>
      <stop offset="0.55" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232723"/>
      <stop offset="1" stop-color="#1a1d1b"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#2e322d" stroke-width="1"/>
    </pattern>
    <g id="micIcon">
      <rect x="-15" y="-46" width="30" height="46" rx="15" fill="#3fbe90"/>
      <path d="M-23 -2 A 23 23 0 0 0 23 -2" fill="none" stroke="#3fbe90" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="21" x2="0" y2="33" stroke="#3fbe90" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ===== background ===== -->
  <rect width="1920" height="1080" fill="#17181c"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.4"/>
  <rect width="1920" height="1080" fill="url(#glowGreen)"/>
  <rect width="1920" height="1080" fill="url(#glowOrange)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- ===== left column ===== -->
  <!-- live chip -->
  <rect x="120" y="120" width="442" height="48" rx="24" fill="#1d201e" stroke="#2e322d" stroke-width="2"/>
  <circle cx="150" cy="144" r="7" fill="#22c55e"/>
  <text x="170" y="151" font-family="Menlo" font-size="19" letter-spacing="2.4" fill="#f0efe9">LIVE · KITCHEN VOICE CONTROL</text>

  <!-- title -->
  <text x="118" y="372" font-family="Arial Black" font-size="212" letter-spacing="-4" fill="#f0efe9">86<tspan fill="#3fbe90" dx="34">IT</tspan></text>
  <!-- flame accent -->
  <g transform="translate(674 200) scale(1.05)">
    <path d="M50 0 C 72 32, 98 54, 98 90 C 98 121, 76 143, 50 143 C 24 143, 2 121, 2 90 C 2 60, 24 42, 33 24 C 37 47, 51 55, 56 45 C 62 33, 57 14, 50 0 Z" fill="url(#flame)"/>
    <path d="M50 62 C 62 76, 72 86, 72 101 C 72 116, 62 126, 50 126 C 38 126, 28 116, 28 101 C 28 86, 40 76, 50 62 Z" fill="#ffe9a8" opacity="0.92"/>
  </g>

  <!-- tagline -->
  <text x="122" y="452" font-family="Helvetica Neue" font-weight="700" font-size="48" fill="#f0efe9">Say it once. Every screen knows.</text>

  <!-- body -->
  <text x="122" y="522" font-family="Helvetica Neue" font-size="27" fill="#a8aea6">A cook says “86 salmon” into a headset. Within a second, salmon is greyed</text>
  <text x="122" y="562" font-family="Helvetica Neue" font-size="27" fill="#a8aea6">out on the kitchen display, the servers’ screen and the online menu.</text>

  <!-- stack chips -->
  <rect x="120" y="608" width="372" height="52" rx="26" fill="#1d201e" stroke="#0f7a57" stroke-width="2"/>
  <text x="146" y="641" font-family="Menlo" font-size="18" letter-spacing="1.6" fill="#3fbe90">ASSEMBLYAI VOICE AGENT API</text>

  <rect x="508" y="608" width="446" height="52" rx="26" fill="#1d201e" stroke="#2e322d" stroke-width="2"/>
  <text x="534" y="641" font-family="Menlo" font-size="18" letter-spacing="1.6" fill="#a8aea6">CLOUDFLARE WORKERS + DO</text>

  <rect x="120" y="676" width="432" height="52" rx="26" fill="#1d201e" stroke="#2e322d" stroke-width="2"/>
  <text x="146" y="709" font-family="Menlo" font-size="18" letter-spacing="1.6" fill="#a8aea6">ONE WEBSOCKET, NO MEDIA SERVER</text>

  <rect x="568" y="676" width="300" height="52" rx="26" fill="#1d201e" stroke="#2e322d" stroke-width="2"/>
  <text x="594" y="709" font-family="Menlo" font-size="18" letter-spacing="1.6" fill="#a8aea6">10 CLIENT-SIDE TOOLS</text>

