    <rect x="238" y="834" width="7" height="16" rx="3.5"/>
    <rect x="252" y="826" width="7" height="32" rx="3.5"/>
    <rect x="266" y="812" width="7" height="60" rx="3.5"/>
    <rect x="280" y="830" width="7" height="24" rx="3.5"/>
    <rect x="294" y="804" width="7" height="76" rx="3.5"/>
    <rect x="308" y="820" width="7" height="44" rx="3.5"/>
    <rect x="322" y="798" width="7" height="88" rx="3.5"/>
    <rect x="336" y="824" width="7" height="36" rx="3.5"/>
    <rect x="350" y="810" width="7" height="64" rx="3.5"/>
    <rect x="364" y="836" width="7" height="12" rx="3.5"/>
    <rect x="378" y="822" width="7" height="40" rx="3.5"/>
    <rect x="392" y="802" width="7" height="80" rx="3.5"/>
    <rect x="406" y="830" width="7" height="24" rx="3.5"/>
    <rect x="420" y="838" width="7" height="8" rx="4"/>
