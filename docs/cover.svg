  <text x="458" y="856" font-family="Menlo" font-size="26" letter-spacing="0.4" fill="#f0efe9">“86 salmon” <tspan fill="#8e958d">→</tspan> <tspan fill="#3fbe90">86</tspan> <tspan fill="#8e958d">→</tspan> <tspan fill="#a8aea6">kds · foh · menu</tspan></text>

  <!-- ===== right column: KDS ticket ===== -->
  <rect x="1150" y="140" width="650" height="560" rx="18" fill="url(#cardGlow)" stroke="#2e322d" stroke-width="2"/>
  <!-- header -->
  <path d="M1150 158 A18 18 0 0 1 1168 140 H1782 A18 18 0 0 1 1800 158 V216 H1150 Z" fill="#0f7a57"/>
  <text x="1184" y="192" font-family="Menlo" font-weight="bold" font-size="30" fill="#ffffff">T12</text>
  <text x="1290" y="192" font-family="Menlo" font-size="22" fill="#bfe9d8">DINNER RUSH</text>
  <text x="1766" y="192" text-anchor="end" font-family="Menlo" font-weight="bold" font-size="30" fill="#ffffff">03:12</text>

