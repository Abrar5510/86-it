  <text x="152" y="794" font-family="Menlo" font-size="15" letter-spacing="2.4" fill="#8e958d">VOICE STATION · LIVE TRANSCRIPT</text>
  <text x="1008" y="794" text-anchor="end" font-family="Menlo" font-size="15" letter-spacing="2.4" fill="#3fbe90">LATENCY 0.9s</text>

  <g transform="translate(178 858) scale(0.82)">
