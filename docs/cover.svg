  <text x="1252" y="414" font-family="Menlo" font-size="27" fill="#8e958d">SALMON</text>
  <line x1="1248" y1="405" x2="1353" y2="405" stroke="#8e958d" stroke-width="3"/>
  <rect x="1682" y="388" width="86" height="38" rx="19" fill="#ef4444"/>
  <text x="1725" y="414" text-anchor="middle" font-family="Menlo" font-weight="bold" font-size="21" letter-spacing="1" fill="#ffffff">86</text>
  <line x1="1182" y1="440" x2="1768" y2="440" stroke="#2e322d" stroke-width="2"/>

  <!-- line 2 -->
