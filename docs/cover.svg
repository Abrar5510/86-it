  <rect x="1150" y="866" width="650" height="84" rx="42" fill="#1d201e" stroke="#2e322d" stroke-width="2"/>
  <circle cx="1194" cy="908" r="9" fill="#22c55e"/>
  <text x="1222" y="916" font-family="Menlo" font-size="22" letter-spacing="1.4" fill="#f0efe9">SALMON 86’D ON KDS · FOH · MENU</text>
  <text x="1764" y="916" text-anchor="end" font-family="Menlo" font-weight="bold" font-size="22" fill="#3fbe90">0.9s</text>

  <!-- ===== footer band ===== -->
  <line x1="120" y1="962" x2="1800" y2="962" stroke="#2e322d" stroke-width="2"/>
  <text x="120" y="1018" font-family="Menlo" font-size="22" letter-spacing="5" fill="#8e958d">86 · FIRE · BUMP · HOLD · ALL DAY · VOID</text>
  <text x="1800" y="1018" text-anchor="end" font-family="Menlo" font-size="22" letter-spacing="4" fill="#8e958d">BUILT ON ASSEMBLYAI · CLOUDFLARE</text>
</svg>
