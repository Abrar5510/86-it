  <script>
    (function() {
      if (typeof gsap === 'undefined') return;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["10-results"] = tl;

      const DURATION = 10.527;

      // --- Ring setup ---
      const ringProgress = document.getElementById('f10-ring-progress');
      const ringGlow = document.getElementById('f10-ring-glow');
      const ringLen = 1131; // 2 * PI * 177

      // --- Hero count-up (96.8%) ---
      const counter = document.getElementById('f10-counter');
      const suffix = document.getElementById('f10-suffix');
      const heroLabel = document.getElementById('f10-hero-label');
      const heroTarget = 96.8;
      const heroStartScale = 0.45;
      const heroCountDur = 2.2;
      const heroEase = 'power3.out';

      // Ring draw (sync with count-up)
      tl.to(ringProgress, {
        strokeDashoffset: ringLen * (1 - heroTarget / 100),
        duration: heroCountDur,
        ease: heroEase
      }, 0.2);

      tl.to(ringGlow, {
        strokeDashoffset: ringLen * (1 - heroTarget / 100),
        opacity: 0.6,
        duration: heroCountDur,
        ease: heroEase
      }, 0.2);

      // Count value with dynamic scale
      const heroState = { value: 0 };
      tl.to(heroState, {
        value: heroTarget,
        duration: heroCountDur,
        ease: heroEase,
        onUpdate: () => {
          counter.textContent = heroState.value.toFixed(1);
        }
      }, 0.2);

      tl.fromTo(counter, { scale: heroStartScale }, { scale: 1, duration: heroCountDur, ease: heroEase }, 0.2);

      // Suffix slides in after count
      tl.to(suffix, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }, 0.2 + heroCountDur);

      // Hero label fades in early
      tl.fromTo(heroLabel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 0.6);

      // --- Ambient glow bloom behind hero ---
      const glow = document.getElementById('f10-glow');
      const heroRing = document.querySelector('.f10-ring-wrap');
      const glowPeakOpacity = 0.25;
      const glowStartScale = 0.85;
      const bloomDur = 1.2;
      const bloomStart = 0.2 + heroCountDur - 0.3; // Land with hero settle

      tl.fromTo(glow, { opacity: 0, scale: glowStartScale }, { opacity: glowPeakOpacity, scale: 1, duration: bloomDur, ease: 'power2.out' }, bloomStart);

      // Bounded breathe during hold
      const glowPhase = { p: 0 };
      const breatheCycles = 1.5;
      const breatheDur = DURATION - (bloomStart + bloomDur);
      tl.to(glowPhase, {
        p: Math.PI * 2 * breatheCycles,
        duration: breatheDur,
        ease: 'none',
        onUpdate: () => {
          const s = Math.sin(glowPhase.p);
          glow.style.opacity = String(glowPeakOpacity + s * 0.03);
          glow.style.transform = `translate(-50%, -50%) scale(${1 + s * 0.015})`;
        }
      }, bloomStart + bloomDur);

      // Position glow behind hero ring at t=0
      tl.set({}, {}, 0).call(() => {
        const rect = heroRing.getBoundingClientRect();
        const rootRect = document.getElementById('root').getBoundingClientRect();
        glow.style.left = (rect.left - rootRect.left + rect.width / 2) + 'px';
        glow.style.top = (rect.top - rootRect.top + rect.height / 2) + 'px';
      });

      // --- Stat Card 1: 12/12 chatter ignored ---
      const card1 = document.getElementById('f10-card-1');
      const stat1 = document.getElementById('f10-stat-1');

      tl.fromTo(card1, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: 'power3.out' }, 3.5);

      // Count up numerator 0->12
      const stat1State = { value: 0 };
      tl.to(stat1State, {
        value: 12,
        duration: 1.0,
        ease: 'power2.out',
        onUpdate: () => {
          stat1.textContent = Math.round(stat1State.value) + '/12';
        }
      }, 3.7);

      // --- Stat Card 2: 0 false triggers ---
      const card2 = document.getElementById('f10-card-2');
      const stat2 = document.getElementById('f10-stat-2');

      tl.fromTo(card2, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: 'power3.out' }, 5.5);

      // Quick pop for "0"
      tl.fromTo(stat2, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.4)' }, 5.7);

      // --- Footnote ---
      const footnote = document.getElementById('f10-footnote');
      tl.fromTo(footnote, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 7.5);

      // --- Multi-phase camera (subtle Bookend pull: neutral -> slight push -> neutral) ---
      const camera = document.getElementById('f10-camera');
      const cameraPhase = { scale: 1.0 };

      // Phase 2: slight push in as hero settles
      tl.to(cameraPhase, { scale: 1.04, duration: 2.0, ease: 'power2.out' }, 2.0);

      // Phase 3: ease back to neutral as cards reveal
      tl.to(cameraPhase, { scale: 1.0, duration: 1.8, ease: 'power2.inOut' }, 5.5);

      // Continuous micro-drift
      const drift = { p: 0 };
      const driftCycles = 1.5;
      tl.to(drift, {
        p: Math.PI * 2 * driftCycles,
        duration: DURATION,
        ease: 'none',
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 4;
          const dy = Math.sin(drift.p * 1.3) * 2;
          camera.style.transform = `scale(${cameraPhase.scale}) translate(${dx}px, ${dy}px)`;
        }
      }, 0);

      // Glow position is set once; subtle drift misalignment is acceptable
    })();
  </script>
</template>
