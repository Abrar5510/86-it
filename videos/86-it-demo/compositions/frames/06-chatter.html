const tl = gsap.timeline({ paused: true });

const quoteEl = document.getElementById("chatterQuote");
const stampEl = document.getElementById("stamp");
const nothingEl = document.getElementById("nothing");
const nothingTextEl = document.getElementById("nothingText");
const ruleEl = document.getElementById("rule");
const dotsEl = document.getElementById("accentDots");
const dotEls = dotsEl.querySelectorAll(".dot");

const dotPaths = [
  { x: -24, y: -18, rot: -72 },
  { x: 28, y: -12, rot: 108 },
  { x: -20, y: 24, rot: -144 },
  { x: 32, y: 18, rot: 36 }
];

tl.fromTo(quoteEl, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);

tl.fromTo(stampEl, { opacity: 0, x: -40, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 1.5);

tl.fromTo(dotsEl, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.5);
dotEls.forEach((dot, i) => {
  const p = dotPaths[i];
  tl.fromTo(dot, { scale: 0, opacity: 0 }, { scale: 1, opacity: 0.6, duration: 0.5, delay: i * 0.08, ease: "back.out(2)" }, 1.5);
  tl.to(dot, { x: p.x, y: p.y, rotation: p.rot, duration: 3.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.8);
});

  }
}, onComplete: () => { nothingTextEl.textContent = nothingText; } }, 2.0);
