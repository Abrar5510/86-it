    const tl = gsap.timeline({ paused: true });

    const items = document.querySelectorAll('.frame-11-item');
    items.forEach((item, i) => {
      const bullet = item.querySelector('.frame-11-bullet');
      const textInner = item.querySelector('.frame-11-text-inner');
      const itemStart = parseFloat(item.dataset.start);

      // Bullet spring-pop entrance
      tl.fromTo(bullet,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        itemStart
      );

        { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: 0.6, ease: "power2.out" },
        itemStart + 0.15
      );

      // Item container fade/slide in
      tl.fromTo(item,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        itemStart
