const blobDrift = (el, dx, dy, period, phase) => {
  const obj = { p: phase };
  tl.to(obj, { p: phase + Math.PI * 2 * (DUR / period), duration: DUR, ease: "none", onUpdate: () => {
    const x = Math.sin(obj.p) * dx;
    const y = Math.sin(obj.p * 1.3) * dy;
    el.style.transform = `translate(${x}px, ${y}px)`;
  }}, 0);
};

blobDrift(blob1, 30, 20, 8, 0);
blobDrift(blob2, -25, 15, 10, Math.PI * 0.5);
blobDrift(blob3, 20, -18, 9, Math.PI);

const nodeIdle = (el, amp, period, phase) => {
  const obj = { p: phase };
  tl.to(obj, { p: phase + Math.PI * 2 * (DUR / period), duration: DUR - 5.5, ease: "none", onUpdate: () => {
    const s = Math.sin(obj.p) * amp;
    const curr = gsap.getProperty(el, "scale") || 1;
    el.style.transform = `translate(-50%, -50%) scale(${curr + s})`;
  }}, 5.5);
};

nodeIdle(station, 0.01, 4, 0);
nodeIdle(ai, 0.012, 3.8, Math.PI * 0.3);
nodeIdle(doNode, 0.01, 4.2, Math.PI * 0.6);
nodeIdle(fanKds, 0.015, 3.5, Math.PI * 0.9);
nodeIdle(fanFoh, 0.015, 3.7, Math.PI * 1.2);
