  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["12-cta"] = tl;

    const wordmarkLetters = document.querySelectorAll('.frame-12-cta-wordmark .letter:not(.space)');
    const urlEl = document.querySelector('.frame-12-cta-url');
    const urlGlow = document.querySelector('.frame-12-cta-url-glow');
    const taglineWords = document.querySelectorAll('.frame-12-cta-tagline .word');
    const caret = document.querySelector('.frame-12-cta-tagline .caret');

    // Phase 1: Wordmark cascade with spring overshoot (0.0 - 1.2s)
    tl.fromTo(wordmarkLetters,
      { x: -60, opacity: 0, rotation: -5 },
      {
        x: 0,
        opacity: 1,
        rotation: 0,
        ease: 'back.out(1.7)',
        duration: 0.6,
        stagger: 0.09,
        clearProps: 'transform,opacity'
      },
      0
    );

    // Phase 2: URL wipe left→right with glowing leading edge (1.2 - 3.2s)
    tl.to(urlEl, {
      clipPath: 'inset(0 0% 0 0)',
      duration: 1.8,
      ease: 'power2.out'
    }, 1.2);

    tl.to(urlGlow, {
      opacity: 0.6,
      duration: 0.3,
      ease: 'power1.out'
    }, 1.2);

    tl.to(urlGlow, {
      x: '100%',
      duration: 1.8,
      ease: 'power2.out'
    }, 1.2);

    tl.to(urlGlow, {
      opacity: 0,
      duration: 0.4,
      ease: 'power1.in'
    }, 2.6);

    // Phase 2b: Tagline word-by-word fade-in with color shift (2.0 - 3.5s)
    tl.fromTo(taglineWords,
      { opacity: 0, color: '#B7B3AF' },
      {
        opacity: 1,
        color: '#0D0F12',
        duration: 0.35,
        ease: 'power1.out',
        stagger: 0.12,
        clearProps: 'color'
      },
      2.0
    );

    // Phase 3: Hold with caret blink (3.5 - 5.773s)
    // Caret blink starts after tagline settles
    tl.to(caret, {
      opacity: 0,
      duration: 0.1,
      ease: 'none',
      repeat: 7,
      yoyo: true,
      repeatDelay: 0.4
    }, 3.5);

    // Subtle continuous scale-up on full lockup during hold (near-imperceptible)
    const lockupElements = [
      ...wordmarkLetters,
      urlEl,
      ...taglineWords,
      caret
    ];
    tl.to(lockupElements, {
      scale: 1.0015,
      duration: 2.273,
      ease: 'none',
      transformOrigin: 'center center'
    }, 3.5);

    // Ensure GSAP is ready
    gsap.set('.frame-12-cta-wordmark .letter.space', { opacity: 1 });
  </script>
